name: Build Revelade Revolution

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            zlib1g-dev libgl1-mesa-dev libglu1-mesa-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            libenet-dev

      - name: Configure
        run: cmake -S src -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist
          cp build/client/client_linux_x64 dist/ || cp build/src/client/client_linux_x64 dist/ || true
          tar czf revelade-linux-x64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: revelade-linux-x64
          path: revelade-linux-x64.tar.gz

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-enet

      - name: Configure
        shell: msys2 {0}
        run: cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -G "MinGW Makefiles"

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --config Release -j$(nproc)

      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/client/client_windows_x64.exe dist/ || cp build/src/client/client_windows_x64.exe dist/ || true
          cp /mingw64/bin/SDL2.dll dist/
          cp /mingw64/bin/SDL2_image.dll dist/
          cp /mingw64/bin/SDL2_mixer.dll dist/
          cd dist && zip -r ../revelade-windows-x64.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: revelade-windows-x64
          path: revelade-windows-x64.zip
